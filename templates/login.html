<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Login HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h1 style="text-align: center; margin-bottom: 30px;">Login Form</h1>
                <form action="" method="post">
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Username</label>
                        <input type="text" class="form-control" id="Input1" placeholder="username" name="username">
                    </div>
                    <div class="mb-3">
                        <label for="Input2" class="form-label">Password</label>
                        <input type="password" class="form-control" id="Input2" name="pwd">
                    </div>
                    <div style="text-align: center; margin-top: 40px;">
                        <input type="button" class="btn btn-primary" value="Log In">
                    </div>
                    <div style="text-align: center; margin-top: 10px;">
                        Are you a new user <a href="register.html">Register</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
