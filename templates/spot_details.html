<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Spot Details HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 610px; width: 520px; margin-top: 80px;">
                <h1 style="text-align: center; margin-bottom: 30px;">Occupied Parking Spot Details</h1>
                <div class="mb-3">
                    <label for="spotid" class="form-label">Spot ID:</label>
                    <input class="form-control" type="text" name="spotid" value="{{ spot.id }}"
                        aria-label="Disabled input example" disabled readonly>
                </div>
                <div class="mb-3">
                    <label for="vehicle_no" class="form-label">Customer ID</label>
                    <input class="form-control" type="text" name="cust_id" value="{{ booking.user_id }}"
                        aria-label="readonly input example" readonly>
                </div>
                <div class="mb-3">
                    <label for="timestamp" class="form-label">Vehicle Number:</label>
                    <input class="form-control" type="text" name="vehicle_no" value="{{ booking.vehicle_no }}"
                        aria-label="readonly input example" readonly>
                </div>
                <div class="mb-3">
                    <label for="release_time" class="form-label">Parking time:</label>
                    <input class="form-control" type="text" name="parking_time"
                        value="{{ booking.parking_timestamp.strftime('%d-%b-%Y %I:%M %p') }}"
                        aria-label="readonly input example" readonly>
                </div>
                <div class="mb-3">
                    <label for="userid" class="form-label">Estimated Parking Cost:</label>
                    <input class="form-control" type="text" value="Rs.{{ cost }}" aria-label="readonly input example"
                        readonly>
                </div>
                <form action="" method="post">
                    <div style="text-align: center; margin-top: 40px;">
                        <a type="button" class="btn btn-secondary" href="/admin_dashboard">Close</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
