<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Spot Details HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 610px; width: 520px; margin-top: 80px;">
                <h1 style="text-align: center; margin-bottom: 30px;">Occupied Parking Spot Details</h1>
                    <div class="mb-3">
                        <label for="spotid" class="form-label">Spot ID:</label>
                        <input class="form-control" type="text" name="spotid" value="xxxx" aria-label="Disabled input example" disabled readonly>
                    </div>
                    <div class="mb-3">
                        <label for="vehicle_no" class="form-label">Customer ID</label>
                        <input class="form-control" type="text" name="cust_id" value="xxxxxx" aria-label="readonly input example" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="timestamp" class="form-label">Vehicle Number:</label>
                        <input class="form-control" type="text" name="vehicle_no" value="TN01AB1234" aria-label="readonly input example" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="release_time" class="form-label">Date/time of Parking:</label>
                        <input class="form-control" type="time" name="parking_time" value="07:40" aria-label="readonly input example" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="userid" class="form-label">Estimated Parking Cost:</label>
                        <input class="form-control" type="text" value="Rs.xxx" aria-label="readonly input example" readonly>
                    </div>
                <form action="" method="post">
                    <div style="text-align: center; margin-top: 40px;">
                        <input type="button" class="btn btn-secondary" value="Close">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
