<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>New Parking Lot HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 650px; width: 520px; margin-top: 55px;">
                <h1 style="text-align: center; margin-bottom: 30px;">New Parking Lot</h1>
                <form action="" method="post">
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Prime Location Name</label>
                        <input type="text" class="form-control" id="Input1" placeholder="ABC Mall" name="location">
                    </div>
                    <div class="mb-3">
                        <label for="Input2" class="form-label">Address</label>
                        <textarea class="form-control" id="Input2" rows="3" name="address"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="Input3" class="form-label">Pin code</label>
                        <input type="text" class="form-control" id="Input3" placeholder="600001" name="pincode">
                    </div>
                    <div class="mb-3">
                        <label for="Input4" class="form-label">Price (per hour in rupees)</label>
                        <input type="number" class="form-control" id="Input4" placeholder="Rs.100" name="price">
                    </div>
                    <div class="mb-3">
                        <label for="Input5" class="form-label">Maximum Spots</label>
                        <input type="number" class="form-control" id="Input5" placeholder="20" name="max_spots">
                    </div>
                    <div style="text-align: center; margin-top: 30px;">
                        <input type="button" class="btn btn-primary" value="Add">
                        <input type="button" class="btn btn-secondary" value="Cancel">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
