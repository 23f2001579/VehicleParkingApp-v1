<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Edit Parking Lot HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/admin_dashboard">Welcome Admin</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="/admin_dashboard">Home</a>
                        <a class="nav-link" href="/admin_dashboard/users">Users</a>
                        <a class="nav-link" href="/admin_dashboard/search">Search</a>
                        <a class="nav-link" href="/admin_dashboard/summary">Summary</a>
                        <a class="nav-link" href="/login">Log Out</a>
                    </div>
                </div>
                <a class="nav-item" style="color:white; text-decoration: none" href="/edit_profile">Edit Profile</a>
            </div>
        </nav>
        <div id="canvas">
            <div id="form-body" style="height: 650px; width: 520px; margin-top: 55px;">
                <h1 style="text-align: center; margin-bottom: 30px;">Edit Parking Lot</h1>
                <form action="{{ url_for('edit_lot', lot_id=lot.id) }}" method="post">
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Prime Location Name</label>
                        <input type="text" class="form-control" id="Input1" value="{{lot.prime_location_name}} " name="location" required>

                    </div>
                    <div class="mb-3">
                        <label for="Input2" class="form-label">Address</label>
                        <textarea class="form-control" id="Input2" rows="3" name="address">{{ lot.address }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="Input3" class="form-label">Pincode</label>
                        <input type="text" class="form-control" id="Input3" value="{{ lot.pincode }}" name="pincode">
                    </div>
                    <div class="mb-3">
                        <label for="Input4" class="form-label">Price (per hour in rupees)</label>
                        <input type="number" class="form-control" id="Input4" value="{{ lot.price }}" name="price">
                    </div>
                    <div class="mb-3">
                        <label for="Input5" class="form-label">Maximum Spots</label>
                        <input type="number" class="form-control" id="Input5" value="{{ lot.maximum_spots }}" name="max_spots">
                    </div>
                    <div style="text-align: center; margin-top: 30px;">
                        <input type="submit" class="btn btn-primary" value="Update">
                        <a href="/admin_dashboard" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
