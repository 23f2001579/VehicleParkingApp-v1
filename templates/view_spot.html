<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>View Spot HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 375px;width: 400px;margin-top: 200px;">
                <h1 style="text-align: center; margin-bottom: 30px;">View/Delete Parking Spot</h1>
                    <div class="mb-3">
                        <label for="spotid" class="form-label">Spot ID:</label>
                        <input class="form-control" type="text" value="xxxxxx" name="spotid" aria-label="Disabled input example" disabled readonly>
                    </div>
                <form action="" method="post">
                    <div class="mb-3">
                        <label for="vehicle_no" class="form-label">Status:</label>
                        <input type="button" class="btn btn-info mx-3" value="Available">
                    </div>
                    <div style="text-align: center; margin-top: 40px;">
                        <input type="button" class="btn btn-danger" value="Delete">
                        <input type="button" class="btn btn-secondary" value="Close">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
