<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Spot Details HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Welcome {{user.name}}</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="/admin_dashboard">Home</a>
                        <a class="nav-link" href="/admin_dashboard/users">Users</a>
                        <a class="nav-link" href="/admin_dashboard/search">Search</a>
                        <a class="nav-link" href="#">Summary</a>
                        <a class="nav-link" href="/login">Log Out</a>
                    </div>
                </div>
            </div>
        </nav>
        <div id="canvas">
            <div id="form-body" style="width: 520px; margin-top: 0px;">
                <h1 style="text-align: center; margin-bottom: 30px;">Occupied Parking Spot Details</h1>
                <div class="mb-3">
                    <label for="spotid" class="form-label">Spot ID:</label>
                    <input class="form-control" type="text" name="spotid" value="{{ spot.id }}"
                        aria-label="Disabled input example" disabled readonly>
                </div>
                <div class="mb-3">
                    <label for="userid" class="form-label">Customer ID</label>
                    <input class="form-control" type="text" name="cust_id" value="{{ booking.user_id }}"
                        aria-label="readonly input example" readonly>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Customer Name</label>
                    <input class="form-control" type="text" name="cust_name" value="{{ customer.name }}"
                        aria-label="readonly input example" readonly>
                </div>
                <div class="mb-3">
                    <label for="vehicle_no" class="form-label">Vehicle Number:</label>
                    <input class="form-control" type="text" name="vehicle_no" value="{{ booking.vehicle_no }}"
                        aria-label="readonly input example" readonly>
                </div>
                <div class="mb-3">
                    <label for="parking_time" class="form-label">Parking time:</label>
                    <input class="form-control" type="text" name="parking_time"
                        value="{{ booking.parking_timestamp.strftime('%d-%b-%Y %I:%M %p') }}"
                        aria-label="readonly input example" readonly>
                </div>
                <div class="mb-3">
                    <label for="cost" class="form-label">Estimated Parking Cost:</label>
                    <input class="form-control" type="text" value="Rs.{{ cost }}" aria-label="readonly input example"
                        readonly>
                </div>
                
                <div style="text-align: center; margin-top: 40px;">
                    <a type="button" class="btn btn-secondary" href="/admin_dashboard">Close</a>
                </div>
                
            </div>
        </div>
    </div>
</body>

</html>
