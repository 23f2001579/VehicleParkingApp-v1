<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Release Parking Spot HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 610px; width: 520px; margin-top: 80px;">
                <h1 style="text-align: center; margin-bottom: 30px;">Release the Parking Spot</h1>
                    <div class="mb-3">
                        <label for="spotid" class="form-label">Spot ID:</label>
                        <input class="form-control" type="text" value="xxxxxx" name="spotid" aria-label="Disabled input example" disabled readonly>
                    </div>
                    <div class="mb-3">
                        <label for="vehicle_no" class="form-label">Vehicle Number:</label>
                        <input class="form-control" type="text" value="xxxxxx" name="vehicle_no" aria-label="Disabled input example" disabled readonly>
                    </div>
                    <div class="mb-3">
                        <label for="timestamp" class="form-label">Parking time:</label>
                        <input class="form-control" type="time" value="20:30" name="parking_time" aria-label="Disabled input example" disabled readonly>
                    </div>
                    <div class="mb-3">
                        <label for="release_time" class="form-label">Releasing time:</label>
                        <input class="form-control" type="time" value="22:35" name="release_time" aria-label="readonly input example" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="userid" class="form-label">Total Cost:</label>
                        <input class="form-control" type="text" value="Rs.xxx" name="total_cost" aria-label="readonly input example" readonly>
                    </div>
                <form action="" method="post">
                    <div style="text-align: center; margin-top: 40px;">
                        <input type="button" class="btn btn-primary" value="Release">
                        <input type="button" class="btn btn-secondary" value="Cancel">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
