<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Edit Profile HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        {% if user.type == "admin" %}
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Welcome {{ user.name }}</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="/admin_dashboard">Home</a>
                        <a class="nav-link" href="/admin_dashboard/users">Users</a>
                        <a class="nav-link" href="/admin_dashboard/search">Search</a>
                        <a class="nav-link" href="/admin_dashboard/summary">Summary</a>
                        <a class="nav-link" href="/login">Log Out</a>
                    </div>
                </div>
                <a class="nav-item" style="color:white; text-decoration: none" href="/edit_profile">Edit Profile</a>
            </div>
        </nav>
        {% else %}
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/user_dashboard">Welcome {{user.name}}</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="/user_dashboard">Home</a>
                        <a class="nav-link" href="/summary">Summary</a>
                        <a class="nav-link" href="/logout">Log Out</a>
                    </div>
                </div>
                <a class="nav-item" style="color:white; text-decoration: none" href="/edit_profile">Edit Profile</a>
            </div>
        </nav>
        {% endif %}
        <div id="canvas">
            <div class="h3 text-center pt-2 pb-2 mb-3 rounded-3 border border-2 border-primary" style="margin: auto; width: 85%;">Edit Profile</div>
            <div id="form-body" style="width: 85%; margin-top: 0px; margin:auto;">
                <form action="/edit_profile" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Email address(Username)</label>
                        <input type="email" class="form-control" value="{{ user.username }}"
                            name="username" disabled readonly>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" rows="3"
                            name="address" required>{{ user.address }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="pincode" class="form-label">Pincode</label>
                        <input type="text" class="form-control"  pattern="\d{6}" 
                        maxlength="6" required placeholder="600xxx" name="pincode" value="{{ user.pincode }}">
                    </div>
                    <div style="margin-top: 30px;">
                        <input type="submit" class="btn btn-primary" value="Save Changes">
                    </div>
                    

                </form>
            </div>
        </div>
    </div>
</body>

</html>
