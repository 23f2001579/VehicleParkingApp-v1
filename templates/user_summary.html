<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>User Summary HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Welcome {{user.name}}</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="/user_dashboard">Home</a>
                        <a class="nav-link active" aria-current="page" href="/summary">Summary</a>
                        <a class="nav-link" href="/login">Log Out</a>
                    </div>
                </div>
            </div>
        </nav>
        <div id="canvas">
            <div class="h3 text-center pt-2 pb-2 mb-3 rounded-3 border border-2 border-primary" style="margin: auto; width: 85%;">User Summary</div>
            <div id="form-body" style="width: 85%; margin-top: 0px; margin:auto;">
                <div class="d-flex mb-3">
                    <label for="bookings" class="form-label mt-2" style="width:200px">Total Bookings made</label>
                    <input class="form-control" type="number" name="user_id" value="{{ count }}" 
                    aria-label="readonly input example" style="width:200px" disabled readonly>
                </div>
                <div class="d-flex mb-3">
                    <label for="duration" class="form-label mt-2" style="width:200px">Total Parking Duration</label>
                    <input class="form-control" type="text" name="duration" value="{{ duration }}" 
                    aria-label="readonly input example" style="width:200px" disabled readonly>
                </div>
                <div class="d-flex mb-3">
                    <label for="total_cost" class="form-label mt-2" style="width:200px">Total Parking Cost</label>
                    <input class="form-control" type="text" name="total_cost" value="Rs. {{ cost }}" 
                    aria-label="readonly input example" style="width:200px" disabled readonly>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
