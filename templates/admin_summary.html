<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin Summary Page HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Welcome {{user.name}}</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="/admin_dashboard">Home</a>
                        <a class="nav-link" href="/admin_dashboard/users">Users</a>
                        <a class="nav-link" href="/admin_dashboard/search">Search</a>
                        <a class="nav-link active" aria-current="page" href="/admin_dashboard/summary">Summary</a>
                        <a class="nav-link" href="/logout">Log Out</a>
                    </div>
                </div>
                <a class="nav-item" style="color:white; text-decoration: none" href="/edit_profile">Edit Profile</a>
            </div>
        </nav>
        <div id="canvas">
            <div class="h3 text-center pt-2 pb-2 mb-3 rounded-3 border border-2 border-primary" style="margin: auto; width: 85%;">Admin Summary</div>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 text-center" style="width: 85%; margin: auto">
                <div class="col">
                    <div class="card text-bg-success mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Total Reservations</h5>
                            <h1 class="card-text">{{ r_count }}</h1>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card text-bg-warning mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Total Parking Spots</h5>
                            <h1 class="card-text">{{ sp_count }}</h1>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <div class="card text-bg-danger mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Gross Revenue</h5>
                            <h1 class="card-text">Rs.{{ revenue }}</h1>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</body>

</html>
