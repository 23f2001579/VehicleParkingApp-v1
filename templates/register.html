<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Register HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 660px; margin-top:60px;">
                <form action="/register" method="post">

                    <h1 style="text-align: center; margin-bottom: 30px;">Register Form</h1>
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Email address(Username)</label>
                        <input type="email" class="form-control" id="Input1" placeholder="name@user.com"
                            name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="Input2" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="Input2" placeholder="" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="Input3" class="form-label">Password</label>
                        <input type="password" class="form-control" id="Input3" name="pwd" required>
                    </div>
                    <div class="mb-3">
                        <label for="Input4" class="form-label">Address</label>
                        <textarea class="form-control" id="address" rows="3"
                            name="address" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="Input5" class="form-label">Pincode</label>
                        <input type="text" class="form-control" id="Input2" pattern="\d{6}" 
                        maxlength="6" required placeholder="600xxx" name="pincode">
                    </div>
                    <div style="text-align: center; margin-top: 10px;">
                        <input type="submit" class="btn btn-primary" value="Register">
                    </div>
                    <div style="text-align: center; margin-top: 10px;">
                        Are you an existing user <a href="/login">Login</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</body>

</html>
