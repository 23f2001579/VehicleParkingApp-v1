<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Register HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 460px;">
                <form action="/register" method="post">
                    
                    <h1 style="text-align: center; margin-bottom: 30px;">Register Form</h1>
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="Input1"
                            placeholder="name@example.com" name="email">
                    </div>
                    <div class="mb-3">
                        <label for="Input2" class="form-label">Username</label>
                        <input type="text" class="form-control" id="Input2" placeholder="username" name="username">
                    </div>
                    <div class="mb-3">
                        <label for="Input3" class="form-label">Password</label>
                        <input type="password" class="form-control" id="Input3" name="pwd">
                    </div>
                    <div style="text-align: center; margin-top: 10px;">
                        <input type="button" class="btn btn-primary" value="Register">
                    </div>
                    <div style="text-align: center; margin-top: 10px;">
                        Are you an existing user <a href="/login">Login</a>
                    </div>
                
                </form>
            </div>
        </div>
    </div>
</body>

</html>
