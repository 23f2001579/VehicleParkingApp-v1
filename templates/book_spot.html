<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Book Parking Spot HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body" style="height: 530px; width: 520px; margin-top: 100px;">
                <h1 style="text-align: center; margin-bottom: 30px;">Book the Parking Spot</h1>
                    <div class="mb-3">
                        <label for="spotid" class="form-label">Spot ID:</label>
                        <input class="form-control" type="text" value="{{ spot.id }}" aria-label="Disabled input example" disabled readonly>
                    </div>
                    <div class="mb-3">
                        <label for="lotid" class="form-label">Lot ID:</label>
                        <input class="form-control" type="text" value="{{ lot.id }}" aria-label="readonly input example" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="userid" class="form-label">User ID:</label>
                        <input class="form-control" type="text" value="{{ user.username }}" aria-label="readonly input example" readonly>
                    </div>
                <form action="" method="post">
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Vehicle Number:</label>
                        <input type="text" class="form-control" id="Input1" placeholder="TN01AB1234" required name="vehicle_no">
                    </div>
                    <div style="text-align: center; margin-top: 40px;">
                        <input type="submit" class="btn btn-primary" value="Reserve">
                        <a href="/user_dashboard" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
